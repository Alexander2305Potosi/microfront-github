<div class="min-h-screen bg-slate-950 p-8 font-sans text-slate-200">
  <div class="max-w-7xl mx-auto space-y-8">
    <!-- Header -->
    <div class="flex items-center justify-between pb-6 border-b border-slate-800">
      <div>
        <div class="inline-flex items-center px-3 py-1 rounded-full border border-blue-500/30 bg-blue-500/10 text-blue-400 text-xs font-bold mb-3">
          <span class="flex h-2 w-2 rounded-full bg-blue-500 mr-2 animate-pulse"></span>
          Microfrontend Remoto Activo
        </div>
        <h1 class="text-4xl font-black text-white tracking-tight">
          Gestión de <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300">Usuarios CRUD</span>
        </h1>
      </div>
      <a href="/" class="group flex items-center px-5 py-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-700 hover:border-slate-500 rounded-xl text-sm font-bold text-slate-300 transition-all shadow-lg">
        <svg width="20" height="20" class="w-5 h-5 mr-2 text-slate-500 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Volver al Host
      </a>
    </div>

    <!-- Create User Card -->
    <div class="p-6 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl">
      <h3 class="text-xl font-bold text-white mb-4">Crear Usuario (CRUD en memoria)</h3>
      <div class="flex gap-4">
        <input 
          type="text" 
          [(ngModel)]="newUserLogin" 
          placeholder="Nombre de usuario..."
          class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-indigo-500"
        />
        @if (canAddUser) {
          <button 
            (click)="addUser()"
            class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-xl font-medium transition-colors"
          >
            Añadir Usuario
          </button>
        }
      </div>
    </div>

    <!-- Data Table -->
    <core-data-table
      title="Usuarios Locales"
      [columns]="tableColumns"
      [data]="users()">
    </core-data-table>
  </div>
</div>
