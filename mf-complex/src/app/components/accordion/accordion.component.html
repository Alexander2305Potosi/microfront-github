<div class="space-y-4">
  @for (item of items; track item.title; let i = $index) {
    <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-sm transition-colors hover:border-slate-600">
      <button 
        (click)="toggleItem(i)"
        class="w-full px-6 py-4 flex items-center justify-between text-left focus:outline-none focus:bg-slate-700/50"
      >
        <span class="text-sm font-semibold text-slate-200">{{ item.title }}</span>
        <span class="ml-6 flex items-center">
          <svg 
            [class]="'w-5 h-5 text-slate-400 transform transition-transform duration-300 ' + (item.isOpen ? 'rotate-180 text-blue-400' : '')" 
            fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </span>
      </button>
      
      <div 
        class="transition-all duration-300 ease-in-out"
        [class.max-h-0]="!item.isOpen"
        [class.max-h-96]="item.isOpen"
        [class.opacity-0]="!item.isOpen"
        [class.opacity-100]="item.isOpen"
      >
        <div class="px-6 pb-5 text-sm text-slate-400 leading-relaxed border-t border-slate-700/50 pt-4">
          {{ item.content }}
        </div>
      </div>
    </div>
  }
</div>
