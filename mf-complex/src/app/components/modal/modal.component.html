@if (isOpen) {
<div class="fixed inset-0 z-50 overflow-y-auto">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm transition-opacity" (click)="onClose()"></div>

  <!-- Modal Panel Wrapper (for scrolling) -->
  <div class="flex min-h-full items-center justify-center p-4">
    <div class="relative bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 w-full max-w-2xl transform transition-all my-8">
    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-slate-700/50">
      <div class="flex items-center space-x-3">
        <div [class]="'w-10 h-10 rounded-full flex items-center justify-center ' + iconClass">
          @if (type === 'warning') {
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
          } @else if (type === 'danger') {
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          } @else {
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          }
        </div>
        <h3 class="text-xl font-bold text-white">{{ title }}</h3>
      </div>
      <button (click)="onClose()" class="text-slate-400 hover:text-white transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <!-- Body -->
    <div class="p-6">
      <div class="text-slate-300 leading-relaxed mb-6">
        <ng-content></ng-content>
      </div>

      @if (showSearch) {
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          </div>
          <input type="text" [(ngModel)]="searchQuery" 
                 class="block w-full pl-10 pr-3 py-3 border border-slate-600 rounded-xl leading-5 bg-slate-900/50 text-slate-300 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all sm:text-sm" 
                 placeholder="Escribe aquí para confirmar o buscar...">
        </div>
      }
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 bg-slate-800/50 border-t border-slate-700/50 rounded-b-2xl flex items-center justify-end space-x-3">
      <button (click)="onClose()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-700 transition-colors">
        Cancelar
      </button>
      <button (click)="onConfirm()" 
              [disabled]="confirmDisabled"
              [class]="'px-6 py-2 rounded-xl text-sm font-bold transition-all shadow-lg ' + buttonClass + (confirmDisabled ? ' opacity-50 cursor-not-allowed' : '')">
        Aceptar
      </button>
    </div>
  </div>
</div>
</div>
}
