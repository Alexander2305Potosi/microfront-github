<div class="min-h-screen bg-slate-950 p-8 font-sans text-slate-200">
  <div class="max-w-7xl mx-auto space-y-8">
    <!-- Header -->
    <div class="flex items-center justify-between pb-6 border-b border-slate-800">
      <div>
        <div class="inline-flex items-center px-3 py-1 rounded-full border border-purple-500/30 bg-purple-500/10 text-purple-400 text-xs font-bold mb-3">
          <span class="flex h-2 w-2 rounded-full bg-purple-500 mr-2 animate-pulse"></span>
          Microfrontend Remoto Activo
        </div>
        <h1 class="text-4xl font-black text-white tracking-tight">
          Búsqueda de <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">Repositorios</span>
        </h1>
      </div>
      <a href="/" class="group flex items-center px-5 py-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-700 hover:border-slate-500 rounded-xl text-sm font-bold text-slate-300 transition-all shadow-lg">
        <svg width="20" height="20" class="w-5 h-5 mr-2 text-slate-500 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Volver al Host
      </a>
    </div>

    <!-- Search Form -->
    <div class="p-6 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl flex gap-4">
      <input 
        type="text" 
        [(ngModel)]="searchTerm" 
        (keyup.enter)="searchRepos()"
        placeholder="Buscar repositorios en GitHub..."
        class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500"
      />
      <button 
        (click)="searchRepos()"
        class="bg-purple-600 hover:bg-purple-700 text-white px-8 py-3 rounded-xl font-bold transition-colors"
      >
        Buscar
      </button>
    </div>

    @if (loading()) {
      <div class="flex justify-center p-12">
        <div class="w-10 h-10 border-4 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
      </div>
    } @else {
      <core-data-table
        title="Resultados de Repositorios"
        [columns]="tableColumns"
        [data]="repos()">
      </core-data-table>
    }
  </div>
</div>
